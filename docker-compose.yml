services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pocat-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pocat-frontend
    env_file:
      - path: .env
        required: false
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
